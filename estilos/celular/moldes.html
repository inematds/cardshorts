<!-- Moldes do estilo celular. "resultados" aceita HTML: <div class="res"><b>Título</b><div>detalhe</div></div> (use <div class="rdx"> para detalhe em vermelho). -->
<template id="notificacao">
<section class="card" style="background:radial-gradient(circle at 30% 20%,#1d3b2a,#07100b 60%)">
  <div style="position:absolute;top:150px;left:0;right:0;text-align:center;font-size:42px;font-weight:500;opacity:.85">{{data}}</div>
  <div style="position:absolute;top:200px;left:0;right:0;text-align:center;font-weight:300;font-size:240px;letter-spacing:-6px">{{hora}}</div>
  <div style="position:absolute;left:60px;right:60px;top:620px;background:rgba(255,255,255,.16);border-radius:44px;padding:38px 44px">
    <div style="display:flex;justify-content:space-between;font-size:32px;opacity:.8;font-weight:600"><span>{{app}}</span><span>agora</span></div>
    <div style="font-size:52px;font-weight:700;margin-top:14px">{{titulo}}</div>
    <div style="font-size:44px;margin-top:8px;opacity:.92;line-height:1.25">{{texto}}</div>
  </div>
  <div style="position:absolute;left:60px;right:60px;top:990px;text-align:center;font-size:30px;opacity:.6">{{aviso}}</div>
  <div class="cap" style="top:1100px">{{legenda}}</div>
  <div class="sml">{{fonte}}</div>
</section>
</template>

<template id="busca">
<section class="card" style="background:#f4f4f6;color:#1a1a1a">
  <div style="position:absolute;left:60px;right:60px;top:240px;background:#fff;border-radius:60px;box-shadow:0 6px 24px rgba(0,0,0,.12);padding:40px 50px;font-size:46px">🔍 {{busca}}</div>
  <div style="position:absolute;left:60px;right:60px;top:470px;font-size:44px">{{resultados}}</div>
  <div class="cap" style="top:1300px;color:#1a1a1a">{{conclusao}}</div>
</section>
</template>

<template id="fila">
<section class="card" style="background:#0b0b0b">
  <div class="cap" style="top:240px">{{titulo}}</div>
  <div style="position:absolute;left:80px;right:80px;top:520px;border:4px solid #333;border-radius:30px;padding:60px 50px;text-align:center">
    <div style="font-size:40px;color:#bbb">Sua posição</div>
    <div style="font-family:'JetBrains Mono';font-weight:700;font-size:118px;color:#ffd23f;margin-top:20px">{{posicao}}</div>
    <div style="font-size:40px;color:#bbb;margin-top:10px">de {{total}}</div>
    <div style="height:30px;border-radius:15px;background:#222;margin-top:50px;overflow:hidden"><div style="width:1%;height:100%;background:#ff4d3d"></div></div>
    <div style="font-family:'JetBrains Mono';font-size:34px;color:#888;margin-top:20px">{{status}}</div>
  </div>
  <div class="cap" style="top:1180px">{{legenda}}</div>
  <div class="sml">{{fonte}}</div>
</section>
</template>

<template id="enquete">
<section class="card" style="background:#111">
  <div class="cap" style="top:260px;font-size:96px">{{pergunta}}</div>
  <div style="position:absolute;left:80px;right:80px;top:900px;height:220px;border-radius:40px;border:6px solid #3ddc84;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:100px;color:#3ddc84">{{sim}}</div>
  <div style="position:absolute;left:80px;right:80px;top:1180px;height:220px;border-radius:40px;background:#ff4d3d;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:100px;color:#2b0602;box-shadow:0 0 80px rgba(255,77,61,.45)">{{nao}}</div>
  <div class="cap" style="top:1460px;font-size:56px;color:#bbb">{{rodape}}</div>
</section>
</template>
